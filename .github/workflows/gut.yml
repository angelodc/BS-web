name: GUT

on:
  push:
    branches-ignore:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  GUT_Tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        run: |
          curl -fsSL -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Import resources
        run: godot --headless --path . --import
      # One process per file: the suites keep global state (card definitions,
      # node names) and GUT's orphan checks crash when files share a process.
      - name: Run GUT
        run: |
          status=0
          for test_file in tests/unit/*.gd tests/integration/*.gd; do
            echo "::group::$test_file"
            godot --headless --path . -s addons/gut/gut_cmdln.gd \
              -gselect="$(basename "$test_file")" -gexit | tee gut.log
            if grep -qE "^Failing Tests[[:space:]]+[1-9]" gut.log \
                || grep -q "Program crashed with signal" gut.log; then
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status
