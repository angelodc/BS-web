name: Prepare New Release

on:
  push:
    branches:
      - main


jobs:
  GUT:
    runs-on: ubuntu-latest
    name: Unit & Integration Tests
    steps:
    - name: "✔️ Checkout"
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Install Godot 4.7.2
      run: |
        curl -fsSL -o godot.zip \
          https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
        unzip -q godot.zip
        chmod +x Godot_v4.7.2-stable_linux.x86_64
        sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
        godot --version
    - name: Import resources
      run: godot --headless --path . --import
    # One process per file: the suites keep global state (card definitions,
    # node names) and GUT's orphan checks crash when files share a process.
    - name: ⚙ Run GUT
      run: |
        status=0
        for test_file in tests/unit/*.gd tests/integration/*.gd; do
          echo "::group::$test_file"
          godot --headless --path . -s addons/gut/gut_cmdln.gd \
            -gselect="$(basename "$test_file")" -gexit | tee gut.log
          if grep -qE "^Failing Tests[[:space:]]+[1-9]" gut.log \
              || grep -q "Program crashed with signal" gut.log; then
            status=1
          fi
          echo "::endgroup::"
        done
        exit $status
  export_web:
    runs-on: ubuntu-latest
    name: Export Web build
    needs: ["GUT"]
    steps:
    - name: "✔️ Checkout"
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: "🤖 Export game"
      id: export
      uses: firebelley/godot-export@v8.0.0
      with:
        godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
        godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
        relative_project_path: ./
        presets_to_export: Web
        archive_output: true
    - name: "📦 Upload Web build"
      uses: actions/upload-artifact@v4
      with:
        name: web-build
        path: ${{ steps.export.outputs.archive_directory }}/*
