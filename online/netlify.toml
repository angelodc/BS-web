[build]
  publish = "site"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/salas"
  to = "/.netlify/functions/salas"
  status = 200

# O celular registra aqui o endereço público do relay toda vez que o túnel muda.
[[redirects]]
  from = "/api/relay"
  to = "/.netlify/functions/relay"
  status = 200

# Confirma qual build está publicado: commit do deploy, semver do jogo, data do
# deploy e versão do relay.
[[redirects]]
  from = "/api/version"
  to = "/.netlify/functions/version"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "fullscreen=(self)"

# O shell do Godot 3.4 pede index.pck e index.wasm sem query de versao, e toda
# exportacao reescreve esses mesmos nomes. Com cache immutable por um ano o
# navegador de quem ja jogou continuaria no build antigo; com must-revalidate
# ele confere o ETag (304 quando nada mudou) e pega o build novo na hora.
[[headers]]
  for = "/game/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/game/*.pck"
  [headers.values]
    Content-Type = "application/octet-stream"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/game/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# A versão muda a cada publicação; o endpoint lê o Last-Modified deste arquivo
# para saber quando o build entrou, então ele não pode vir do cache do CDN.
[[headers]]
  for = "/version.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

# PWA: o manifest precisa do MIME certo para o navegador oferecer a instalação.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=0, must-revalidate"

# O service worker é o que torna o site instalável; sempre revalidar para uma
# publicação nova ser adotada na próxima visita.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/pwa.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# O ID do GA4 fica neste arquivo e muda sem trocar o build do jogo.
[[headers]]
  for = "/analytics.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/auth.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
